name: 听写复习本
options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: zh-Hans
settings:
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_OPTIMIZATION_LEVEL: "0"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      GCC_OPTIMIZATION_LEVEL: s
schemes:
  听写复习本:
    build:
      targets:
        听写复习本: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: TypoReviewTests
targets:
  听写复习本:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - 错字复习
    dependencies:
      - target: TypoWidget
        embed: true
    entitlements:
      path: 错字复习/错字复习.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cc.xiaorsz.typo-review
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.cc.xiaorsz.typo-review
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.application-groups:
          - group.cc.xiaorsz.typo-review
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: 错字复习/TypoReview-Bridging-Header.h
        PRODUCT_NAME: TypoReview
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.typo-review
        MARKETING_VERSION: 1.7.0
        CURRENT_PROJECT_VERSION: 4
        ALWAYS_SEARCH_USER_PATHS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: FCAW792CJD
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 听写复习本
        INFOPLIST_KEY_UIBackgroundModes:
          - remote-notification
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_TypoReviewServerURL: https://111.231.22.148/typo-review-sync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh_Hans
        INFOPLIST_KEY_CFBundleLocalizations:
          - zh_Hans
          - en
      configs:
        Debug:
          APS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ENABLE_TESTABILITY: YES
        Release:
          APS_ENVIRONMENT: production

  TypoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypoWidget
      - path: 错字复习/AppModel.swift
        type: file
      - path: 错字复习/TaskItem.swift
        type: file
      - path: 错字复习/ReviewItem.swift
        type: file
      - path: 错字复习/DictationSession.swift
        type: file
      - path: 错字复习/DictationEntry.swift
        type: file
      - path: 错字复习/TaskCompletion.swift
        type: file
      - path: 错字复习/TaskSubitem.swift
        type: file
      - path: 错字复习/TaskExecutionSupport.swift
        type: file
      - path: 错字复习/ReviewRecord.swift
        type: file
      - path: 错字复习/Points.swift
        type: file
      - path: 错字复习/AppSettings.swift
        type: file
      - path: 错字复习/AppDataChangeCenter.swift
        type: file
      - path: 错字复习/DailyCalculation.swift
        type: file
      - path: 错字复习/ScheduleItem.swift
        type: file
    info:
      path: TypoWidget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "听写复习本"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    entitlements:
      path: TypoWidget/TypoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cc.xiaorsz.typo-review
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: TypoWidget
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.typo-review.TypoWidget
        DEVELOPMENT_TEAM: FCAW792CJD
        MARKETING_VERSION: 1.7.0
        CURRENT_PROJECT_VERSION: 4
        ALWAYS_SEARCH_USER_PATHS: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  TypoReviewTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypoReviewTests
    dependencies:
      - target: 听写复习本
    settings:
      base:
        PRODUCT_NAME: TypoReviewTests
        PRODUCT_BUNDLE_IDENTIFIER: cc.xiaorsz.typo-review.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ALWAYS_SEARCH_USER_PATHS: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TypoReview.app/TypoReview"
        BUNDLE_LOADER: "$(TEST_HOST)"
